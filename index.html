<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파비콘 적용 테스트</title>
    <!-- 초기 파비콘 (빈 이미지 또는 기본값) -->
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden md:max-w-2xl">
        <div class="p-8">
            <div class="uppercase tracking-wide text-sm text-indigo-500 font-semibold mb-1">파비콘(Favicon) 테스트</div>
            <h1 class="block mt-1 text-lg leading-tight font-medium text-black mb-6">이미지를 넣어 확인해보세요</h1>
            
            <!-- 업로드 섹션 -->
            <div class="flex flex-col items-center justify-center w-full mb-6">
                <label for="favicon-upload" class="flex flex-col items-center justify-center w-full h-32 border-2 border-indigo-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-indigo-50 transition-colors">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-4 text-indigo-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                        </svg>
                        <p class="text-sm text-gray-500"><span class="font-semibold text-indigo-600">클릭하여 이미지 업로드</span></p>
                        <p class="text-xs text-gray-400 mt-1">PNG, ICO, JPG 파일</p>
                    </div>
                    <input id="favicon-upload" type="file" class="hidden" accept="image/*" onchange="previewFavicon(this)" />
                </label>
            </div>

            <!-- 미리보기 섹션 -->
            <div id="preview-area" class="hidden animate-fade-in">
                <div class="flex items-center space-x-4 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="flex-shrink-0">
                        <img id="img-preview" class="h-16 w-16 object-contain rounded-md border border-gray-300 bg-white" src="" alt="Favicon Preview">
                    </div>
                    <div>
                        <div class="text-sm font-medium text-black">적용 확인</div>
                        <p class="text-xs text-gray-500">
                            1. 위 브라우저 탭 아이콘이 바뀌었나요?<br>
                            2. 왼쪽 이미지가 선택한 이미지인가요?
                        </p>
                    </div>
                </div>
            </div>

            <hr class="border-gray-200 my-6">

            <!-- 코드 설명 섹션 -->
            <h2 class="text-md font-bold text-gray-800 mb-2">실제 프로젝트에 적용하는 법</h2>
            <p class="text-sm text-gray-600 mb-4">
                이미지 파일 이름을 <code class="bg-gray-100 px-1 py-0.5 rounded text-indigo-600 font-mono text-xs">favicon.png</code>로 변경하여 HTML 파일과 같은 폴더에 넣고, 아래 코드를 <code class="bg-gray-100 px-1 py-0.5 rounded text-red-500 font-mono text-xs">&lt;head&gt;</code> 태그 안에 붙여넣으세요.
            </p>
            
            <div class="bg-gray-800 rounded-lg p-4 relative group">
                <code class="text-xs text-green-400 font-mono break-all">
                    &lt;link rel="icon" type="image/png" href="favicon.png"&gt;
                </code>
                <button onclick="copyCode()" class="absolute top-2 right-2 bg-gray-700 hover:bg-gray-600 text-white text-xs px-2 py-1 rounded transition-colors">
                    복사
                </button>
            </div>
        </div>
    </div>

    <!-- 토스트 메시지 -->
    <div id="toast" class="fixed bottom-5 right-5 bg-indigo-600 text-white px-4 py-2 rounded shadow-lg transform translate-y-20 opacity-0 transition-all duration-300">
        코드가 복사되었습니다!
    </div>

    <script>
        function previewFavicon(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();

                reader.onload = function(e) {
                    // 1. 페이지 내 미리보기 이미지 변경
                    document.getElementById('img-preview').src = e.target.result;
                    document.getElementById('preview-area').classList.remove('hidden');

                    // 2. 실제 브라우저 탭 파비콘 변경 (핵심 로직)
                    var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                    link.type = 'image/x-icon';
                    link.rel = 'icon';
                    link.href = e.target.result;
                    document.getElementsByTagName('head')[0].appendChild(link);
                }

                reader.readAsDataURL(input.files[0]);
            }
        }

        function copyCode() {
            const code = '<link rel="icon" type="image/png" href="favicon.png">';
            
            // iframe 환경 등에서 clipboard API가 제한될 수 있으므로 execCommand 사용
            const el = document.createElement('textarea');
            el.value = code;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            showToast();
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
